# Render Blueprint -- provisions the API and its Postgres database together.
#
# Usage:
#   1. Push this repo to GitHub (scripts/push-to-github.ps1 or .sh).
#   2. In the Render dashboard: New -> Blueprint -> pick this repo.
#   3. Render reads this file, provisions `aivoa-db` and `aivoa-api`, and
#      asks you once for the GROQ_API_KEY value (left blank runs the
#      deterministic fallback engine -- the product still works end to end).
#   4. Once the service is live, copy its URL into the frontend's
#      VITE_API_BASE environment variable on Vercel and redeploy the frontend.
#
# https://render.com/docs/blueprint-spec

databases:
  - name: aivoa-db
    databaseName: aivoa
    user: aivoa
    plan: free
    region: oregon

services:
  - type: web
    name: aivoa-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aivoa-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      # gemma2-9b-it (assignment-mandated) is decommissioned by Groq and
      # llama-3.3-70b-versatile (assignment-mandated) is Enterprise-tier-gated
      # as of this build -- see docs/DEPLOYMENT.md, Step 0.
      - key: EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: REASONING_MODEL
        value: openai/gpt-oss-120b
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Update after the frontend is deployed to Vercel -- comma-separated,
      # no trailing slash. Until then the API still works, it just rejects
      # cross-origin browser requests from an unlisted frontend.
      - key: CORS_ORIGINS
        value: https://aivoa.vercel.app
